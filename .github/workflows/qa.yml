name: Cat Jelly source, physics and browser QA
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    paths:
      - '*.html'
      - 'src/**'
      - 'vendor/**'
      - 'assets/**'
      - 'qa/**'
      - '.github/workflows/**'
jobs:
  static-physics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 qa/validate.py
      - run: node qa/physics.cjs
      - run: node qa/fracture.cjs
      - run: node qa/dynamics.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: cat-jelly
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/cat-jelly-tools" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/cat-jelly-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run Pages-path desktop and mobile acceptance tests
        env:
          NODE_PATH: ${{ runner.temp }}/cat-jelly-tools/node_modules
          CAT_QA_OUTPUT: ${{ runner.temp }}/cat-jelly-qa
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 > "$RUNNER_TEMP/cat-jelly-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node cat-jelly/qa/browser-v3.cjs
          node cat-jelly/qa/browser-liquid.cjs
          node cat-jelly/qa/browser-input.cjs
          node cat-jelly/qa/browser-materials.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-jelly-browser-evidence
          path: ${{ runner.temp }}/cat-jelly-qa/
          if-no-files-found: ignore
