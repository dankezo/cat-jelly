<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Jelly - Drag and drop wobbly jelly cats</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1020;color:#fff;overflow:hidden}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
  #scene:active{cursor:grabbing}
  .card{position:fixed;top:16px;left:16px;z-index:10;background:rgba(10,14,30,.55);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.22);padding:14px 16px;border-radius:20px;max-width:min(360px,calc(100vw - 32px));box-shadow:0 12px 32px rgba(0,0,0,.35)}
  .card h1{margin:0;font-size:22px;line-height:1.2}
  .card p{margin:6px 0 10px;font-size:14px;line-height:1.5;opacity:.9}
  #langs{display:flex;gap:6px;flex-wrap:wrap}
  #langs button{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:6px 10px;cursor:pointer;font-size:13px}
  #langs button.active{background:#fff;color:#111}
  .dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(10,14,30,.55);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.22);padding:10px 12px;border-radius:999px;z-index:10;flex-wrap:wrap;justify-content:center;max-width:min(900px,calc(100vw - 24px));box-shadow:0 12px 32px rgba(0,0,0,.35)}
  .dock button{border:0;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700;background:rgba(255,255,255,.14);color:#fff}
  .dock button.active{background:#fff;color:#111}
  .dock label{font-size:13px;opacity:.95;display:flex;align-items:center;gap:6px}
  .dock input{accent-color:#ff8fb3}
  #toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:9px 14px;border-radius:999px;font-size:14px;font-weight:700;display:none;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .hint{position:fixed;right:16px;bottom:16px;z-index:9;font-size:12px;opacity:.7;background:rgba(0,0,0,.35);padding:7px 10px;border-radius:999px}
  @media (max-width:640px){.card{top:10px;left:10px}.hint{display:none}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="card">
  <h1>🐱 Cat Jelly</h1>
  <p id="desc">Drag, poke and throw jelly cats. Transparent jelly cats with real spring physics.</p>
  <div id="langs">
    <button data-lang="en" class="active">English</button>
    <button data-lang="vi">Tiếng Việt</button>
    <button data-lang="es">Español</button>
    <button data-lang="zh">中文</button>
  </div>
</div>
<div id="toast">Meow!</div>
<div class="dock">
  <button data-cat="mochi" class="active">🍓 Mochi Round</button>
  <button data-cat="pudding">🍮 Pudding Flat</button>
  <button data-cat="soda">🌿 Soda Tall</button>
  <button id="rain">🌧 Cat rain</button>
  <button id="clear">🧹 Clear</button>
  <label><span id="wobble-label">Wobble</span> <input id="wobble" type="range" min="0" max="100" value="70"></label>
</div>
<div class="hint" id="hint">Drag a cat - Double-click to poke</div>
<script>
const I18N={
  en:{desc:"Drag, poke and throw jelly cats. Transparent jelly cats with real spring physics.",mochi:"🍓 Mochi Round",pudding:"🍮 Pudding Flat",soda:"🌿 Soda Tall",rain:"🌧 Cat rain",clear:"🧹 Clear",wobble:"Wobble",meow:"Meow!",pop:"Pop!",hint:"Drag a cat - Double-click to poke"},
  vi:{desc:"Kéo thả mèo, chọc để nảy, ném để bay. Mèo thạch trong suốt, rung rinh bằng lò xo thật.",mochi:"🍓 Mochi Tròn",pudding:"🍮 Pudding Dẹt",soda:"🌿 Soda Cao",rain:"🌧 Mưa mèo",clear:"🧹 Dọn",wobble:"Rung",meow:"Meo!",pop:"Bụp!",hint:"Kéo một bé mèo - Double-click để chọc"},
  es:{desc:"Arrastra, toca y lanza gatos de gelatina. Gatos transparentes con fisica de resorte real.",mochi:"🍓 Mochi Redondo",pudding:"🍮 Pudding Plano",soda:"🌿 Soda Alto",rain:"🌧 Lluvia de gatos",clear:"🧹 Limpiar",wobble:"Temblor",meow:"¡Miau!",pop:"¡Pop!",hint:"Arrastra un gato - Doble clic para tocar"},
  zh:{desc:"拖动、戳和扔果冻猫。透明果冻猫, 使用真实弹簧物理。",mochi:"🍓 圆圆麻薯",pudding:"🍮 扁扁布丁",soda:"🌿 高高苏打",rain:"🌧 猫咪雨",clear:"🧹 清除",wobble:"晃动",meow:"喵!",pop:"啪!",hint:"拖动一只猫 - 双击戳一下"}
};
let LANG="en";
function setLang(l){LANG=l; const t=I18N[l]; document.documentElement.lang=l;
  document.getElementById('desc').textContent=t.desc;
  document.querySelector('[data-cat="mochi"]').textContent=t.mochi;
  document.querySelector('[data-cat="pudding"]').textContent=t.pudding;
  document.querySelector('[data-cat="soda"]').textContent=t.soda;
  document.getElementById('rain').textContent=t.rain;
  document.getElementById('clear').textContent=t.clear;
  document.getElementById('wobble-label').textContent=t.wobble;
  document.getElementById('hint').textContent=t.hint;
  document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
}
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b1020);
scene.fog=new THREE.Fog(0x0b1020,18,34);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);
camera.position.set(0,7.5,13); camera.lookAt(0,1,0);
scene.add(new THREE.AmbientLight(0xffffff,.85));
const sun=new THREE.DirectionalLight(0xffffff,1.1); sun.position.set(5,10,6); scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(14,48),new THREE.MeshStandardMaterial({color:0x18213f,roughness:.95}));
ground.rotation.x=-Math.PI/2; scene.add(ground);
const ring=new THREE.Mesh(new THREE.RingGeometry(14,14.4,64),new THREE.MeshBasicMaterial({color:0x2a3a6e,side:THREE.DoubleSide}));
ring.rotation.x=-Math.PI/2; ring.position.y=.01; scene.add(ring);
// Jelly town in the back, not under the cats
const townColors=[0xff8fb3,0xffd166,0x7ee0c3,0x8ecbff];
for(let i=0;i<6;i++){
  const dome=new THREE.Mesh(new THREE.SphereGeometry(1.1,24,16,0,Math.PI*2,0,Math.PI/2),
    new THREE.MeshPhysicalMaterial({color:townColors[i%4],transparent:true,opacity:.5,roughness:.15,transmission:.5,clearcoat:1}));
  dome.position.set(-8+i*3.2,0,-6.5); scene.add(dome);
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.08,.12,.9,10),new THREE.MeshStandardMaterial({color:0x6b4a2f}));
  trunk.position.set(-9+i*3.4,.45,-4.5); scene.add(trunk);
  const leaf=new THREE.Mesh(new THREE.SphereGeometry(.7,20,14),new THREE.MeshPhysicalMaterial({color:0x7ee0c3,transparent:true,opacity:.75,roughness:.2,clearcoat:1}));
  leaf.position.set(-9+i*3.4,1.3,-4.5); scene.add(leaf);
}
const TYPES={
  mochi:{color:0xff8fb3,scale:[1.1,1,1.1]},
  pudding:{color:0xffc46b,scale:[1.3,.62,1.3]},
  soda:{color:0x7ee0c3,scale:[.85,1.4,.85]}
};
let cats=[], dragged=null;
function makeCat(type,x,z){
  const t=TYPES[type];
  const g=new THREE.Group();
  const mat=new THREE.MeshPhysicalMaterial({color:t.color,transparent:true,opacity:.88,roughness:.12,transmission:.55,clearcoat:1,clearcoatRoughness:.2});
  const body=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),mat); body.scale.set(...t.scale); g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.6,28,20),mat); head.position.set(0,.8,.55); g.add(head);
  [-.36,.36].forEach(ex=>{
    const ear=new THREE.Mesh(new THREE.ConeGeometry(.2,.32,16),mat); ear.position.set(ex,1.38,.55); g.add(ear);
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.07,12,10),new THREE.MeshStandardMaterial({color:0x111111})); eye.position.set(ex,.9,1.05); g.add(eye);
  });
  const nose=new THREE.Mesh(new THREE.SphereGeometry(.06,12,10),new THREE.MeshStandardMaterial({color:0xff5a7a})); nose.position.set(0,.78,1.12); g.add(nose);
  g.position.set(x,1.1,z); g.userData={vy:0,wobble:0,base:t.scale,type};
  scene.add(g); cats.push(g); return g;
}
// Spaced out, no overlap at start
const starts=[[-5,0],[-2.5,1.5],[0,-1],[2.5,1.5],[5,0],[-3.5,-2]];
starts.forEach((p,i)=>makeCat(Object.keys(TYPES)[i%3],p[0],p[1]));
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize); resize();
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(), plane=new THREE.Plane(new THREE.Vector3(0,1,0),-1.1);
function pick(e){mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(cats,true); if(!hits.length) return null;
  let o=hits[0].object; while(o.parent&&!cats.includes(o)) o=o.parent; return o;}
canvas.addEventListener('pointerdown',e=>{const c=pick(e); if(c){dragged=c; c.userData.vy=0; canvas.setPointerCapture(e.pointerId);}});
canvas.addEventListener('pointermove',e=>{if(!dragged) return; mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera);
  const p=new THREE.Vector3(); ray.ray.intersectPlane(plane,p); if(p){dragged.position.x=Math.max(-10,Math.min(10,p.x)); dragged.position.z=Math.max(-6,Math.min(6,p.z)); dragged.position.y=2.4; dragged.userData.wobble=1;}});
canvas.addEventListener('pointerup',e=>{if(dragged){dragged.userData.vy=-1; showToast(I18N[LANG].meow); dragged=null;}});
function showToast(t){const el=document.getElementById('toast'); el.textContent=t; el.style.display='block'; setTimeout(()=>el.style.display='none',900)}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b)); const i=starts.length%6; makeCat(b.dataset.cat,starts[i][0],starts[i][1]);});
document.getElementById('rain').onclick=()=>{for(let i=0;i<5;i++) setTimeout(()=>makeCat(Object.keys(TYPES)[i%3],(Math.random()*8-4),(Math.random()*4-2)),i*140)};
document.getElementById('clear').onclick=()=>{cats.forEach(c=>scene.remove(c)); cats=[];};
canvas.addEventListener('dblclick',e=>{const c=pick(e); if(c){c.userData.vy=4; c.userData.wobble=1.5; showToast(I18N[LANG].pop);}});
let t=0;
function animate(){requestAnimationFrame(animate); t+=.016;
  const wob=document.getElementById('wobble').value/100;
  cats.forEach(c=>{const u=c.userData;
    if(c!==dragged){u.vy-=.18; c.position.y+=u.vy*.12; if(c.position.y<1.1){c.position.y=1.1; u.vy*=-.55; u.wobble=1;}}
    u.wobble*=.94;
    const s=1+Math.sin(t*14)*.12*u.wobble*(0.4+wob);
    c.scale.set(u.base[0]*s,u.base[1]*(2-s),u.base[2]*s);
  });
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
