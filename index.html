<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Jelly Press - Press, burst and play with jelly cats</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f3e9d2;color:#1a1a1a;overflow:hidden}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
  .mast{position:fixed;top:14px;left:16px;z-index:10;background:rgba(255,252,245,.92);border:1px solid rgba(0,0,0,.12);padding:12px 14px;border-radius:16px;max-width:min(380px,calc(100vw - 32px));box-shadow:0 10px 28px rgba(0,0,0,.18)}
  .mast h1{margin:0;font-size:22px;letter-spacing:.4px;line-height:1.1}
  .mast h1 span{background:#111;color:#fff;padding:1px 7px;border-radius:6px}
  .mast p{margin:5px 0 8px;font-size:13px;color:#444}
  #langs{display:flex;gap:6px;flex-wrap:wrap}
  #langs button{border:1px solid rgba(0,0,0,.2);background:#fff;color:#111;border-radius:999px;padding:5px 9px;cursor:pointer;font-size:12px}
  #langs button.active{background:#111;color:#fff}
  .topr{position:fixed;top:14px;right:16px;z-index:10;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .topr button,.topr a{border:1px solid rgba(0,0,0,.15);border-radius:999px;padding:9px 12px;cursor:pointer;font-weight:700;background:#fff;color:#111;text-decoration:none;font-size:13px}
  .deck{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:10;background:rgba(255,252,245,.94);border:1px solid rgba(0,0,0,.12);padding:10px 12px;border-radius:20px;width:min(680px,calc(100vw - 24px));max-height:44dvh;overflow:auto;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.2)}
  #caption{font-size:15px;font-weight:700;min-height:22px;color:#111}
  #verdict{font-size:20px;font-style:italic;color:#b02a2a;min-height:26px}
  .gauge-row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:6px 0}
  .dial{width:60px;height:60px;border-radius:50%;background:conic-gradient(#ff5a7a 0deg,#e8e0d0 0deg);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .dial span{background:#fffcf5;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  #pressure{font-size:13px;color:#444}
  .controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
  .controls button{border:0;border-radius:999px;padding:11px 16px;cursor:pointer;font-weight:800}
  #hold{background:#ff3b30;color:#fff;font-size:16px}
  #raise{background:#111;color:#fff}
  .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .chips button{border:1px solid rgba(0,0,0,.2);background:#fff;color:#111;border-radius:999px;padding:6px 10px;cursor:pointer}
  .chips button.active{background:#111;color:#fff}
  #toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 14px;border-radius:999px;font-weight:700;display:none;z-index:20}
  @media (max-width:640px){.mast{top:10px;left:10px}.topr{top:auto;bottom:210px;right:10px}.mast h1{font-size:19px}}
  @media (max-height:720px){#help{display:none}.deck{padding:8px 10px}.dial{width:48px;height:48px}.dial span{width:36px;height:36px;font-size:11px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="mast">
  <h1>CAT JELLY <span>PRESS</span></h1>
  <p id="sub">Four jelly cats. One hydraulic press.</p>
  <div id="langs">
    <button data-lang="en" class="active">English</button>
    <button data-lang="vi">Tiếng Việt</button>
    <button data-lang="es">Español</button>
    <button data-lang="zh">中文</button>
  </div>
</div>
<div class="topr"><button id="reset">Reset</button><button id="sound">Sound: On</button><a href="https://github.com/dankezo/cat-jelly">GitHub</a></div>
<div id="toast"></div>
<div class="deck">
  <div id="caption">Hold the red button to press.</div>
  <div id="verdict"></div>
  <div class="gauge-row">
    <div class="dial" id="dial"><span id="dial-text">0 bar</span></div>
    <div><div id="pressure">0 bar - 100% height</div><div style="font-size:12px;color:#666" id="help">Camera locked - Drag the cat on the bed - Hold Space to press - Drag pieces and crumbs after the burst</div></div>
  </div>
  <div class="controls">
    <button id="hold">HOLD TO PRESS</button>
    <button id="raise">Raise</button>
    <button id="next">Next cat</button>
  </div>
  <div class="chips">
    <button data-cat="mochi" class="active">1 - Mochi Round</button>
    <button data-cat="pudding">2 - Pudding Flat</button>
    <button data-cat="soda">3 - Soda Tall</button>
    <button data-cat="orange">4 - Orange Tabby</button>
  </div>
</div>
<script>
const I18N={
  en:{sub:"Four jelly cats. One hydraulic press.",hold:"Hold the red button to press.",grab:"Grab a piece. Throw it.",caps:["Contact.","It is fine. It is jelly.","Getting wider.","That is a pancake now.","It is making a noise.","Please."],verdicts:{mochi:"Splat.",pudding:"Squashed.",soda:"Well, that is jam.",orange:"Crushed."},reset:"Reset",soundOn:"Sound: On",soundOff:"Sound: Off",holdBtn:"HOLD TO PRESS",raise:"Raise",next:"Next cat",help:"Camera locked - Drag the cat on the bed - Hold Space to press - Drag pieces and crumbs after the burst"},
  vi:{sub:"Bốn mèo thạch. Một máy ép thủy lực.",hold:"Giữ nút đỏ để ép.",grab:"Nắm một mảnh. Ném nó đi.",caps:["Chạm rồi.","Ổn thôi. Đây là thạch mà.","Đang bè ra.","Giờ thành bánh dẹt rồi.","Nó đang kêu.","Thôi mà."],verdicts:{mochi:"Bẹp!",pudding:"Dẹp lép!",soda:"Thôi, thành mứt rồi.",orange:"Nát bét!"},reset:"Đặt lại",soundOn:"Âm thanh: Bật",soundOff:"Âm thanh: Tắt",holdBtn:"GIỮ ĐỂ ÉP",raise:"Nâng lên",next:"Mèo tiếp theo",help:"Camera khóa - Kéo mèo trên bàn - Giữ Space để ép - Sau khi vỡ thì kéo mảnh và vụn"},
  es:{sub:"Cuatro gatos de gelatina. Una prensa hidraulica.",hold:"Mantén el botón rojo para prensar.",grab:"Agarra un trozo. Lánzalo.",caps:["Contacto.","Está bien. Es gelatina.","Se está ensanchando.","Ya es un panqueque.","Está haciendo ruido.","Por favor."],verdicts:{mochi:"¡Plaf!",pudding:"¡Aplastado!",soda:"Bueno, eso es mermelada.",orange:"¡Triturado!"},reset:"Reiniciar",soundOn:"Sonido: On",soundOff:"Sonido: Off",holdBtn:"MANTENER PARA PRENSAR",raise:"Subir",next:"Siguiente gato",help:"Camara fija - Arrastra el gato - Mantén Espacio para prensar - Después del estallido arrastra los trozos"},
  zh:{sub:"四只果冻猫。一台液压机。",hold:"按住红色按钮进行按压。",grab:"抓住一块。扔出去。",caps:["接触了。","没事。这是果冻。","越来越宽了。","现在成了一张饼。","它在出声。","求你了。"],verdicts:{mochi:"啪!",pudding:"压扁了!",soda:"好吧, 成果酱了。",orange:"压碎了!"},reset:"重置",soundOn:"声音: 开",soundOff:"声音: 关",holdBtn:"按住按压",raise:"抬起",next:"下一只猫",help:"镜头锁定 - 拖动猫 - 按住空格按压 - 爆裂后拖动碎片和碎屑"}
};
let LANG="en", soundOn=true, burst=false;
function setLang(l){LANG=l; const t=I18N[l]; document.documentElement.lang=l;
  document.getElementById('sub').textContent=t.sub;
  document.getElementById('caption').textContent=burst? t.grab : t.hold;
  document.getElementById('reset').textContent=t.reset;
  document.getElementById('sound').textContent=soundOn? t.soundOn : t.soundOff;
  document.getElementById('hold').textContent=t.holdBtn;
  document.getElementById('raise').textContent=t.raise;
  document.getElementById('next').textContent=t.next;
  document.getElementById('help').textContent=t.help;
  document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
}
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
function beep(f,d=.08){if(!soundOn) return; try{const ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(); const g=ctx.createGain(); o.frequency.value=f; g.gain.setValueAtTime(.12,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+d); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+d);}catch(e){}}
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xf3e9d2);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);
camera.position.set(0,4.6,12.5); camera.lookAt(0,2,0);
scene.add(new THREE.AmbientLight(0xffffff,.85));
const sun=new THREE.DirectionalLight(0xffffff,1.2); sun.position.set(5,10,6); sun.castShadow=true; scene.add(sun);
const bed=new THREE.Mesh(new THREE.BoxGeometry(7,.4,5),new THREE.MeshStandardMaterial({color:0x8a8f98,metalness:.7,roughness:.35}));
bed.position.y=.2; bed.receiveShadow=true; scene.add(bed);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0xe8dcc8,roughness:.9}));
floor.rotation.x=-Math.PI/2; floor.position.y=-.01; floor.receiveShadow=true; scene.add(floor);
const postMat=new THREE.MeshStandardMaterial({color:0x333a44,metalness:.8,roughness:.3});
[-2.2,2.2].forEach(x=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,6,16),postMat); p.position.set(x,3,-1); p.castShadow=true; scene.add(p);});
const beam=new THREE.Mesh(new THREE.BoxGeometry(5.4,.5,.8),postMat); beam.position.set(0,6,-1); scene.add(beam);
const platen=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.35,.45,32),new THREE.MeshStandardMaterial({color:0xb02a2a,metalness:.6,roughness:.35}));
platen.position.set(0,5,-.2); platen.castShadow=true; scene.add(platen);
const ram=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,2,16),postMat); ram.position.set(0,6.2,-.2); scene.add(ram);
const CATS={
  mochi:{color:0xff8fb3,hex:'#ff8fb3',tex:'glossy',scale:[1.1,1,1.1]},
  pudding:{color:0xffc46b,hex:'#ffc46b',tex:'dotted',scale:[1.3,.62,1.3]},
  soda:{color:0x7ee0c3,hex:'#7ee0c3',tex:'bubbly',scale:[.85,1.4,.85]},
  orange:{color:0xff9a3d,hex:'#ff9a3d',tex:'striped',scale:[1,1.15,1]}
};
function makeJellyTexture(kind, base){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const x=c.getContext('2d'); x.fillStyle=base; x.fillRect(0,0,256,256);
  if(kind==='striped'){ x.fillStyle='rgba(120,60,0,.35)'; for(let i=-256;i<512;i+=32){ x.beginPath(); x.moveTo(i,0); x.lineTo(i+32,256); x.lineTo(i+48,256); x.lineTo(i+16,0); x.fill(); } }
  if(kind==='dotted'){ x.fillStyle='rgba(255,255,255,.55)'; for(let i=0;i<40;i++){ x.beginPath(); x.arc(Math.random()*256,Math.random()*256,6+Math.random()*10,0,7); x.fill(); } }
  if(kind==='bubbly'){ x.strokeStyle='rgba(255,255,255,.8)'; x.lineWidth=3; for(let i=0;i<24;i++){ x.beginPath(); x.arc(Math.random()*256,Math.random()*256,8+Math.random()*18,0,7); x.stroke(); } }
  if(kind==='glitter'){ for(let i=0;i<120;i++){ x.fillStyle=Math.random()<.5?'rgba(255,255,255,.95)':'rgba(255,220,120,.95)'; x.fillRect(Math.random()*256,Math.random()*256,3,3); } }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
let current="mochi", cat=null, pieces=[], crumbs=[], pressing=false, raising=false, pressY=5, pressTarget=5, squash=0, squashVel=0, wob=0, wobVel=0, burstAt=.58, dragged=null, dragVel={x:0,z:0}, lastDrag=null, draggedCat=false, catVel={x:0,z:0}, lastCat=null;
function makeCat(type){
  if(cat) scene.remove(cat);
  pieces.forEach(p=>scene.remove(p)); pieces=[];
  crumbs.forEach(p=>scene.remove(p)); crumbs=[];
  burst=false; squash=0; squashVel=0; wob=0; wobVel=0; pressY=5; pressTarget=5; burstAt=.54+Math.random()*.12; draggedCat=false;
  const t=CATS[type]; const g=new THREE.Group();
  const tex=makeJellyTexture(t.tex,t.hex);
  const mat=new THREE.MeshPhysicalMaterial({map:tex,color:0xffffff,transparent:true,opacity:.92,roughness:.12,transmission:.45,clearcoat:1,clearcoatRoughness:.15});
  const cream=new THREE.MeshPhysicalMaterial({color:0xfff5e6,transparent:true,opacity:.95,roughness:.3,clearcoat:.6});
  const dark=new THREE.MeshStandardMaterial({color:0x111111,roughness:.4});
  const pink=new THREE.MeshStandardMaterial({color:0xff6b9d,roughness:.4});
  function add(mesh,x,y,z){ mesh.position.set(x,y,z); mesh.castShadow=true; g.add(mesh); return mesh; }
  const body=add(new THREE.Mesh(new THREE.SphereGeometry(1,48,32),mat),0,.1,0); body.scale.set(...t.scale);
  const belly=add(new THREE.Mesh(new THREE.SphereGeometry(.72,32,24),cream),0,-.05,.55); belly.scale.set(.8,.85,.45);
  const head=add(new THREE.Mesh(new THREE.SphereGeometry(.62,40,28),mat),0,.95,.55);
  [-.36,.36].forEach(ex=>{
    const ear=add(new THREE.Mesh(new THREE.ConeGeometry(.22,.36,20),mat),ex,1.48,.55);
    const inner=add(new THREE.Mesh(new THREE.ConeGeometry(.12,.22,16),pink),ex,1.44,.62);
    const eye=add(new THREE.Mesh(new THREE.SphereGeometry(.085,16,12),dark),ex,.98,1.08);
    const hi=add(new THREE.Mesh(new THREE.SphereGeometry(.028,10,8),new THREE.MeshBasicMaterial({color:0xffffff})),ex-.02,1.02,1.15);
    [-.5,0,.5].forEach((dy,wi)=>{
      const w=add(new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,.55,6),dark),ex*1.9,.85+dy*.12,1.1);
      w.rotation.z=Math.PI/2 + (ex>0?-1:1)*.25; w.rotation.y=ex>0?-.4:.4;
    });
  });
  const muzzle=add(new THREE.Mesh(new THREE.SphereGeometry(.32,28,20),cream),0,.82,1.12); muzzle.scale.set(1,.62,.5);
  const nose=add(new THREE.Mesh(new THREE.ConeGeometry(.09,.12,12),pink),0,.92,1.38); nose.rotation.x=Math.PI;
  const mouth=add(new THREE.Mesh(new THREE.TorusGeometry(.11,.015,8,20,Math.PI),dark),0,.78,1.36); mouth.rotation.z=Math.PI;
  [[-.55,.55],[-.55,-.55],[.55,.55],[.55,-.55]].forEach(([lx,lz])=>{
    const leg=add(new THREE.Mesh(new THREE.CylinderGeometry(.17,.2,.45,16),mat),lx,-.78,lz);
    add(new THREE.Mesh(new THREE.SphereGeometry(.2,20,14),mat),lx,-1.0,lz);
  });
  const tail=add(new THREE.Mesh(new THREE.TorusGeometry(.45,.16,14,28,4.2),mat),-.9,.25,-.6); tail.rotation.set(.4,.6,1.2);
  g.position.set(0,1.6,-.2); g.userData={base:t.scale};
  scene.add(g); cat=g;
  document.getElementById('caption').textContent=I18N[LANG].hold;
  document.getElementById('verdict').textContent="";
}
function doBurst(){
  burst=true; const t=CATS[current];
  const mat=new THREE.MeshPhysicalMaterial({color:t.color,transparent:true,opacity:.9,roughness:.1,transmission:.55,clearcoat:1});
  scene.remove(cat); cat=null; beep(120,.3);
  for(let i=0;i<7;i++){
    const s=.35+Math.random()*.45;
    const m=new THREE.Mesh(new THREE.SphereGeometry(s,28,20),mat); m.castShadow=true;
    m.scale.set(1+Math.random()*.4,.6+Math.random()*.4,1+Math.random()*.4);
    m.position.set((Math.random()*2-1)*1.2,1.5+Math.random(),-.2+(Math.random()*2-1));
    m.userData={vy:2+Math.random()*3,vx:(Math.random()*2-1)*2,vz:(Math.random()*2-1)*2,wob:0,wobVel:0};
    scene.add(m); pieces.push(m);
  }
  const crumbTex=['glossy','striped','dotted','bubbly','glitter'].map(k=>makeJellyTexture(k,t.hex));
  for(let i=0;i<42;i++){
    const cm=new THREE.MeshPhysicalMaterial({map:crumbTex[i%5],color:0xffffff,transparent:true,opacity:.92,roughness:.15,transmission:.4,clearcoat:1});
    const m=new THREE.Mesh(new THREE.SphereGeometry(.08+Math.random()*.1,18,14),cm); m.castShadow=true;
    m.scale.set(1+Math.random()*.5,.5+Math.random()*.5,1+Math.random()*.5);
    m.position.set(cat?cat.position.x:0,1.4+Math.random()*.5,cat?cat.position.z:-.2);
    m.userData={vy:3+Math.random()*4,vx:(Math.random()*2-1)*4,vz:(Math.random()*2-1)*4,wob:0,wobVel:0,ground:.45};
    scene.add(m); crumbs.push(m);
  }
  document.getElementById('verdict').textContent=I18N[LANG].verdicts[current];
  document.getElementById('caption').textContent=I18N[LANG].grab;
  setTimeout(()=>{document.getElementById('verdict').textContent="";},2600);
}
function setCat(type){current=type; document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('active',b.dataset.cat===type)); makeCat(type);}
document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>setCat(b.dataset.cat));
document.getElementById('next').onclick=()=>{const ks=Object.keys(CATS); setCat(ks[(ks.indexOf(current)+1)%ks.length]);};
document.getElementById('reset').onclick=()=>setCat(current);
document.getElementById('sound').onclick=e=>{soundOn=!soundOn; e.target.textContent=soundOn? I18N[LANG].soundOn : I18N[LANG].soundOff;};
const holdBtn=document.getElementById('hold');
holdBtn.addEventListener('pointerdown',()=>pressing=true);
addEventListener('pointerup',()=>pressing=false);
document.getElementById('raise').addEventListener('pointerdown',()=>raising=true);
document.getElementById('raise').addEventListener('pointerup',()=>raising=false);
addEventListener('keydown',e=>{if(e.code==="Space"||e.key==="ArrowDown") pressing=true; if(e.key==="ArrowUp") raising=true; if(e.key==="r"||e.key==="R") setCat(current); if(["1","2","3","4"].includes(e.key)) setCat(Object.keys(CATS)[+e.key-1]);});
addEventListener('keyup',e=>{if(e.code==="Space"||e.key==="ArrowDown") pressing=false; if(e.key==="ArrowUp") raising=false;});
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize); resize();
canvas.addEventListener('wheel',e=>e.preventDefault(),{passive:false});
canvas.addEventListener('gesturestart',e=>e.preventDefault());
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(), plane=new THREE.Plane(new THREE.Vector3(0,1,0),-1);
function pick(e,objs){mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,camera); const h=ray.intersectObjects(objs,false); return h.length? h[0].object : null;}
const planeCat=new THREE.Plane(new THREE.Vector3(0,1,0),-1.6);
canvas.addEventListener('pointerdown',e=>{
  if(!burst && cat){
    mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera);
    if(ray.intersectObjects(cat.children,true).length){ draggedCat=true; lastCat={x:cat.position.x,z:cat.position.z,t:performance.now()}; canvas.setPointerCapture(e.pointerId); beep(400,.06); return; }
  }
  if(!burst) return; const p=pick(e,pieces.concat(crumbs)); if(p){dragged=p; lastDrag={x:p.position.x,z:p.position.z,t:performance.now()}; canvas.setPointerCapture(e.pointerId); beep(300,.06);}
});
canvas.addEventListener('pointermove',e=>{
  if(draggedCat && cat){ mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera); const v=new THREE.Vector3(); ray.ray.intersectPlane(planeCat,v); if(v){ const now=performance.now(); const dt=Math.max(1,now-lastCat.t)/1000; catVel={x:(v.x-lastCat.x)/dt,z:(v.z-lastCat.z)/dt}; lastCat={x:v.x,z:v.z,t:now}; cat.position.x=Math.max(-2.8,Math.min(2.8,v.x)); cat.position.z=Math.max(-1.8,Math.min(1.8,v.z)); } return; }
  if(!dragged) return; mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera); const v=new THREE.Vector3(); ray.ray.intersectPlane(plane,v); if(v){const now=performance.now(); const dt=Math.max(1,now-lastDrag.t)/1000; dragVel={x:(v.x-lastDrag.x)/dt,z:(v.z-lastDrag.z)/dt}; lastDrag={x:v.x,z:v.z,t:now}; dragged.position.x=Math.max(-3,Math.min(3,v.x)); dragged.position.z=Math.max(-2.5,Math.min(2.5,v.z)); dragged.position.y=1.8;}});
canvas.addEventListener('pointerup',()=>{if(draggedCat){ draggedCat=false; wobVel+=Math.min(2,Math.abs(catVel.x)*.1); } if(dragged){dragged.userData.vx=dragVel.x*.15; dragged.userData.vz=dragVel.z*.15; dragged.userData.vy=1; dragged=null;}});
makeCat(current);
let last=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(.033,(now-last)/1000); last=now;
  camera.position.set(0,4.6,12.5); camera.lookAt(0,2,0);
  if(pressing) pressTarget=burst? 2.2 : 2.2;
  if(raising) pressTarget=5;
  if(!pressing && !raising && !burst) pressTarget=5;
  pressY += (pressTarget-pressY)*Math.min(1,dt*6);
  platen.position.y=pressY; ram.position.y=pressY+1.2;
  if(!burst && cat){
    const targetSquash=pressing? Math.min(1,(5-pressY)/2.8) : 0;
    squashVel += (targetSquash-squash)*dt*8; squashVel*=.88; squash += squashVel*dt*4; squash=Math.max(0,Math.min(1,squash));
    wobVel += (-wob*90 - wobVel*8)*dt; wob += wobVel*dt;
    if(pressing && squash>=burstAt) doBurst();
    const idx=Math.min(I18N[LANG].caps.length-1,Math.floor(squash*6));
    if(pressing) document.getElementById('caption').textContent=I18N[LANG].caps[idx];
    const sy=cat.userData.base[1]*(1-squash*.55)*(1+wob*.08);
    const sxz=1/Math.sqrt(Math.max(.3,1-squash*.55));
    cat.scale.set(cat.userData.base[0]*sxz*(1+wob*.05),sy,cat.userData.base[2]*sxz*(1-wob*.05));
    cat.position.y=1.6-(squash*.4);
    if(draggedCat){ cat.rotation.z=-Math.max(-.3,Math.min(.3,catVel.x*.03)); cat.rotation.x=Math.max(-.25,Math.min(.25,catVel.z*.03)); }
    else { cat.rotation.z*=.9; cat.rotation.x*=.9; }
  }
  if(burst && pressing){pieces.forEach(p=>{p.scale.y=Math.max(.35,p.scale.y*(1-dt*.5));}); crumbs.forEach(p=>{p.scale.y=Math.max(.3,p.scale.y*(1-dt*.5));});}
  crumbs.forEach(p=>{const u=p.userData;
    if(p!==dragged){ u.vy-=.35; p.position.y+=u.vy*.12; p.position.x+=u.vx*.03; p.position.z+=u.vz*.03;
      const onBed=Math.abs(p.position.x)<3.5 && Math.abs(p.position.z)<2.5; const ground=onBed?.5:.1;
      if(p.position.y<ground){ p.position.y=ground; u.vy=Math.abs(u.vy)>.8?-u.vy*.45:0; u.vx*=.8; u.vz*=.8; }
      if(Math.abs(p.position.x)>3.4) u.vx*=-1; if(Math.abs(p.position.z)>2.4) u.vz*=-1; }
    p.rotation.x+=dt*2; p.rotation.y+=dt*2; });
  pieces.forEach(p=>{const u=p.userData;
    if(p!==dragged){u.vy-=.15; p.position.y+=u.vy*.12; p.position.x+=u.vx*.02; p.position.z+=u.vz*.02; if(p.position.y<.5){p.position.y=.5; u.vy*=-.5; u.vx*=.7; u.vz*=.7;} if(Math.abs(p.position.x)>3) u.vx*=-1; if(Math.abs(p.position.z)>2.5) u.vz*=-1;}
    u.wobVel += (-u.wob*80 - u.wobVel*6)*dt; u.wob += u.wobVel*dt;
    p.rotation.x+=dt*.8; p.rotation.y+=dt*.8;
  });
  const pressure=Math.round(squash*400);
  document.getElementById('dial').style.background="conic-gradient(#ff5a7a "+(pressure/400*360)+"deg,#e8e0d0 0deg)";
  document.getElementById('dial-text').textContent=pressure+" bar";
  document.getElementById('pressure').textContent=pressure+" bar - "+Math.round((1-squash)*100)+"% height";
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
